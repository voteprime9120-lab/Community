name: Build Windows exe

on:
  push:
    branches: [claude/sharp-hawking-r18uia, main]
    paths: [deck_launcher.py, assets/**, .github/workflows/build-exe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow pygame

      - name: Build DeckLauncher.exe
        run: >
          python -m PyInstaller --onefile --noconsole --clean
          --name DeckLauncher --icon assets/icon.ico
          --add-data "assets;assets"
          deck_launcher.py

      - name: Smoke test (exe starts)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\DeckLauncher.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "DeckLauncher.exe exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Get-Item dist\DeckLauncher.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DeckLauncher-windows
          path: dist/DeckLauncher.exe

      - name: Publish to release "launcher-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-latest
          target_commitish: ${{ github.sha }}
          name: Deck Launcher (Windows exe)
          prerelease: true
          make_latest: false
          body: |
            Deck Launcher Windows 실행 파일입니다. `DeckLauncher.exe` 를 내려받아 원하는 폴더에 두고 실행하세요.
            앱 목록(apps.json)은 exe 옆에 자동으로 만들어집니다.
            빌드 커밋: ${{ github.sha }}
          files: dist/DeckLauncher.exe
